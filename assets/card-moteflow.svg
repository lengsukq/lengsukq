<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 168" width="580" height="168" fill="none">
  <defs>
    <linearGradient id="bg-moteflow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bar-moteflow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow-moteflow" cx="15%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090E1A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-moteflow">
      <rect x="0" y="0" width="580" height="168" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <g clip-path="url(#clip-moteflow)">
    <rect width="580" height="168" rx="16" fill="url(#bg-moteflow)"/>
    <rect width="580" height="168" rx="16" fill="url(#glow-moteflow)"/>
    <rect x="0" y="0" width="580" height="3.5" fill="url(#bar-moteflow)"/>
    <rect x="1" y="1" width="578" height="166" rx="16" stroke="#C084FC" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- Header -->
    <circle cx="30" cy="36" r="5" fill="#F05138"/>
    <text x="44" y="41" class="sans" font-size="19" font-weight="700" fill="#F8FAFC">MoteFlow</text>

    <!-- Category Pill -->
    <rect x="24" y="54" width="159" height="20" rx="10" fill="#C084FC" fill-opacity="0.14" stroke="#C084FC" stroke-opacity="0.4"/>
    <text x="103.5" y="68" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#C084FC">HID · Voice · macOS</text>
    <text x="195" y="68" class="mono" font-size="10.5" fill="#64748B">Updated 2026-11-19</text>

    <!-- Top Right Status / Stars Pill -->
    <rect x="466" y="23" width="90" height="24" rx="12" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-opacity="0.5"/>
    <circle cx="481" cy="35" r="3" fill="#34D399">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="519" y="39" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#34D399">ACTIVE</text>

    <!-- Description -->
    <text x="24" y="94" class="sans" font-size="13" fill="#CBD5E1">原生 macOS 无线远程控制中枢（SwiftUI + 蓝牙 HID）</text>
    <text x="24" y="114" class="sans" font-size="13" fill="#94A3B8">支持自定义键鼠映射、低延迟语音输入与系统级自动化操作</text>

    <!-- Tags -->
    <rect x="24" y="128" width="75" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="61.6" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">SwiftUI</text><rect x="107.19999999999999" y="128" width="56" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="135.2" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">HID</text><rect x="171.2" y="128" width="90" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="216.4" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">Bluetooth</text><rect x="269.59999999999997" y="128" width="98" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="318.6" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">Automation</text>
  </g>
</svg>
