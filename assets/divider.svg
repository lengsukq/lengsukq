<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" fill="none">
  <defs>
    <linearGradient id="lineBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="25%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="1"/>
      <stop offset="75%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lineClip">
      <rect x="20" y="10" width="1160" height="4" rx="2"/>
    </clipPath>
  </defs>
  <rect x="20" y="11" width="1160" height="2" rx="1" fill="url(#lineBase)"/>
  <g clip-path="url(#lineClip)">
    <rect x="-260" y="10" width="260" height="4" rx="2" fill="url(#pulseBeam)">
      <animate attributeName="x" values="-260;1220" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="600" cy="12" r="4" fill="#38BDF8" fill-opacity="0.9">
    <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
