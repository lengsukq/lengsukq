<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 168" width="580" height="168" fill="none">
  <defs>
    <linearGradient id="bg-paraphrasing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bar-paraphrasing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow-paraphrasing" cx="15%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090E1A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-paraphrasing">
      <rect x="0" y="0" width="580" height="168" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <g clip-path="url(#clip-paraphrasing)">
    <rect width="580" height="168" rx="16" fill="url(#bg-paraphrasing)"/>
    <rect width="580" height="168" rx="16" fill="url(#glow-paraphrasing)"/>
    <rect x="0" y="0" width="580" height="3.5" fill="url(#bar-paraphrasing)"/>
    <rect x="1" y="1" width="578" height="166" rx="16" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- Header -->
    <circle cx="30" cy="36" r="5" fill="#41B883"/>
    <text x="44" y="41" class="sans" font-size="19" font-weight="700" fill="#F8FAFC">ParaphrasingToolClient</text>

    <!-- Category Pill -->
    <rect x="24" y="54" width="166" height="20" rx="10" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="107.0" y="68" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#10B981">Popular · AI Rewrite</text>
    <text x="202" y="68" class="mono" font-size="10.5" fill="#64748B">Updated 2026-07-23</text>

    <!-- Top Right Status / Stars Pill -->
    <rect x="466" y="23" width="90" height="24" rx="12" fill="#FBBF24" fill-opacity="0.15" stroke="#FBBF24" stroke-opacity="0.5"/>
    <circle cx="481" cy="35" r="3" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="519" y="39" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FBBF24">★ 80</text>

    <!-- Description -->
    <text x="24" y="94" class="sans" font-size="13" fill="#CBD5E1">论文 AI 智能降重客户端，支持 PaperYY 查重报告精确解析</text>
    <text x="24" y="114" class="sans" font-size="13" fill="#94A3B8">可视化逐句对照与自定义大模型接口，已部署在线服务</text>

    <!-- Tags -->
    <rect x="24" y="128" width="60" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="54.0" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">Vue 3</text><rect x="92.0" y="128" width="98" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="141.0" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">TypeScript</text><rect x="198.0" y="128" width="56" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="226.0" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">LLM</text><rect x="262.0" y="128" width="56" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="290.0" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">Web</text>
  </g>
</svg>
