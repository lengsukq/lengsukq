<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 168" width="580" height="168" fill="none">
  <defs>
    <linearGradient id="bg-lucent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bar-lucent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow-lucent" cx="15%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090E1A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-lucent">
      <rect x="0" y="0" width="580" height="168" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <g clip-path="url(#clip-lucent)">
    <rect width="580" height="168" rx="16" fill="url(#bg-lucent)"/>
    <rect width="580" height="168" rx="16" fill="url(#glow-lucent)"/>
    <rect x="0" y="0" width="580" height="3.5" fill="url(#bar-lucent)"/>
    <rect x="1" y="1" width="578" height="166" rx="16" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- Header -->
    <circle cx="30" cy="36" r="5" fill="#F05138"/>
    <text x="44" y="41" class="sans" font-size="19" font-weight="700" fill="#F8FAFC">Lucent</text>

    <!-- Category Pill -->
    <rect x="24" y="54" width="187" height="20" rx="10" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.4"/>
    <text x="117.5" y="68" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#38BDF8">Apple Silicon · Swift 6</text>
    <text x="223" y="68" class="mono" font-size="10.5" fill="#64748B">Updated 2026-11-22</text>

    <!-- Top Right Status / Stars Pill -->
    <rect x="466" y="23" width="90" height="24" rx="12" fill="#FBBF24" fill-opacity="0.15" stroke="#FBBF24" stroke-opacity="0.5"/>
    <circle cx="481" cy="35" r="3" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="519" y="39" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FBBF24">★ 3</text>

    <!-- Description -->
    <text x="24" y="94" class="sans" font-size="13" fill="#CBD5E1">Liquid Glass 原生启动器：Everything 级检索、QQ 式截图 OCR</text>
    <text x="24" y="114" class="sans" font-size="13" fill="#94A3B8">集成 System Pulse 监控、实时网络监视与高效文件工作区</text>

    <!-- Tags -->
    <rect x="24" y="128" width="75" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="61.6" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">Swift 6</text><rect x="107.19999999999999" y="128" width="113" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="163.8" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">Liquid Glass</text><rect x="228.39999999999998" y="128" width="56" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="256.4" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">OCR</text><rect x="292.4" y="128" width="60" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="322.4" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">macOS</text>
  </g>
</svg>
