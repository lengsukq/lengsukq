<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 168" width="580" height="168" fill="none">
  <defs>
    <linearGradient id="bg-opaldesk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bar-opaldesk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow-opaldesk" cx="15%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090E1A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-opaldesk">
      <rect x="0" y="0" width="580" height="168" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>

  <g clip-path="url(#clip-opaldesk)">
    <rect width="580" height="168" rx="16" fill="url(#bg-opaldesk)"/>
    <rect width="580" height="168" rx="16" fill="url(#glow-opaldesk)"/>
    <rect x="0" y="0" width="580" height="3.5" fill="url(#bar-opaldesk)"/>
    <rect x="1" y="1" width="578" height="166" rx="16" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- Header -->
    <circle cx="30" cy="36" r="5" fill="#A97BFF"/>
    <text x="44" y="41" class="sans" font-size="19" font-weight="700" fill="#F8FAFC">OpalDesk</text>

    <!-- Category Pill -->
    <rect x="24" y="54" width="187" height="20" rx="10" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.4"/>
    <text x="117.5" y="68" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#A78BFA">Multi-Display · No Root</text>
    <text x="223" y="68" class="mono" font-size="10.5" fill="#64748B">Updated 2026-11-27</text>

    <!-- Top Right Status / Stars Pill -->
    <rect x="466" y="23" width="90" height="24" rx="12" fill="#FBBF24" fill-opacity="0.15" stroke="#FBBF24" stroke-opacity="0.5"/>
    <circle cx="481" cy="35" r="3" fill="#FBBF24">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="519" y="39" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FBBF24">★ 58</text>

    <!-- Description -->
    <text x="24" y="94" class="sans" font-size="13" fill="#CBD5E1">免 Root Android 多屏桌面工作站（LocalDeX / 外接显示器）</text>
    <text x="24" y="114" class="sans" font-size="13" fill="#94A3B8">支持 macOS 原生高速串流、Type-C 扩展与 Liquid Glass 窗口引擎</text>

    <!-- Tags -->
    <rect x="24" y="128" width="68" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="57.8" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">Kotlin</text><rect x="99.6" y="128" width="75" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="137.2" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">Compose</text><rect x="182.79999999999998" y="128" width="75" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="220.4" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">SwiftUI</text><rect x="266.0" y="128" width="75" height="22" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-opacity="0.8"/><text x="303.6" y="143" text-anchor="middle" class="mono" font-size="10.5" fill="#CBD5E1">Shizuku</text>
  </g>
</svg>
