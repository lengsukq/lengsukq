<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0B1221"/>
      <stop offset="100%" stop-color="#090D1A"/>
    </linearGradient>

    <!-- Aurora Ambient Glows -->
    <radialGradient id="glowCyan" cx="22%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="62%" r="46%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="55%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <!-- Shimmer Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="75%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glass Frame Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.14"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="370" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes scanLine {
      0% { transform: translateX(-220px); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translateX(1250px); opacity: 0; }
    }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse-core { transform-origin: 985px 185px; animation: pulse 3.4s ease-in-out infinite; }
    .float-badge { animation: floatSlow 5s ease-in-out infinite; }
    .scan-beam { animation: scanLine 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Base Layer -->
    <rect width="1200" height="370" fill="url(#bgGrad)"/>
    <rect width="1200" height="370" fill="url(#dotGrid)"/>
    <rect width="1200" height="370" fill="url(#glowCyan)"/>
    <rect width="1200" height="370" fill="url(#glowPurple)"/>
    <rect width="1200" height="370" fill="url(#glowEmerald)"/>

    <!-- Top Light Sweep -->
    <rect class="scan-beam" x="0" y="0" width="180" height="2" fill="url(#titleGrad)" opacity="0.8"/>

    <!-- Outer Frame Stroke -->
    <rect x="1" y="1" width="1198" height="368" rx="22" stroke="url(#glassBorder)" stroke-width="1.5"/>

    <!-- Left: Liquid Glass Terminal Window -->
    <rect x="34" y="30" width="710" height="310" rx="16" fill="#0B1324" fill-opacity="0.72" stroke="#334155" stroke-opacity="0.7" stroke-width="1.2"/>
    <rect x="34" y="30" width="710" height="38" rx="16" fill="#111C33" fill-opacity="0.85"/>
    <rect x="34" y="54" width="710" height="14" fill="#111C33" fill-opacity="0.85"/>
    <line x1="34" y1="68" x2="744" y2="68" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>

    <!-- Window Traffic Lights -->
    <circle cx="58" cy="49" r="6" fill="#FB7185"/>
    <circle cx="78" cy="49" r="6" fill="#FBBF24"/>
    <circle cx="98" cy="49" r="6" fill="#34D399"/>

    <!-- Terminal Title -->
    <text x="122" y="53" class="mono" font-size="12.5" fill="#94A3B8">lengsukq@apple-silicon — ~/workspace/universe</text>
    <rect x="658" y="39" width="70" height="20" rx="10" fill="#10B981" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.45"/>
    <circle cx="672" cy="49" r="3.5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="682" y="53" class="mono" font-size="10.5" font-weight="600" fill="#6EE7B7">ONLINE</text>

    <!-- Terminal Prompt 1 -->
    <text x="58" y="102" class="mono" font-size="13.5" fill="#38BDF8">❯</text>
    <text x="76" y="102" class="mono" font-size="13.5" fill="#94A3B8">whoami --role</text>

    <!-- Hero Title -->
    <text x="58" y="160" class="sans" font-size="56" font-weight="800" letter-spacing="-1.5" fill="url(#titleGrad)" filter="url(#softGlow)">lengsukq</text>
    <rect x="320" y="128" width="112" height="26" rx="13" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="376" y="145" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#7DD3FC">全干工程师</text>

    <!-- Subtitle -->
    <text x="58" y="196" class="sans" font-size="16.5" font-weight="500" fill="#E2E8F0">
      Full-Stack &amp; Native Systems Builder · macOS / Android / AI Infra
    </text>

    <!-- Motto Prompt -->
    <text x="58" y="234" class="mono" font-size="14" fill="#34D399">❯</text>
    <text x="76" y="234" class="mono" font-size="14" fill="#A5B4FC">echo</text>
    <text x="118" y="234" class="sans" font-size="14.5" fill="#CBD5E1">“编程铸就思维，思维成就编程”</text>
    <rect class="cursor" x="342" y="220" width="9" height="17" rx="2" fill="#38BDF8"/>

    <!-- Capability Pills -->
    <g class="float-badge">
      <rect x="58" y="264" width="156" height="30" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.4"/>
      <circle cx="75" cy="279" r="4" fill="#F97316"/>
      <text x="87" y="283" class="mono" font-size="12" fill="#E2E8F0">Swift 6 · SwiftUI</text>

      <rect x="224" y="264" width="154" height="30" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#818CF8" stroke-opacity="0.4"/>
      <circle cx="241" cy="279" r="4" fill="#34D399"/>
      <text x="253" y="283" class="mono" font-size="12" fill="#E2E8F0">Android · Kotlin</text>

      <rect x="388" y="264" width="166" height="30" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#34D399" stroke-opacity="0.4"/>
      <circle cx="405" cy="279" r="4" fill="#38BDF8"/>
      <text x="417" y="283" class="mono" font-size="12" fill="#E2E8F0">Next.js · Go · Rust</text>

      <rect x="564" y="264" width="156" height="30" rx="8" fill="#1E293B" fill-opacity="0.85" stroke="#C084FC" stroke-opacity="0.4"/>
      <circle cx="581" cy="279" r="4" fill="#C084FC"/>
      <text x="593" y="283" class="mono" font-size="12" fill="#E2E8F0">AI Agents · Cloud</text>
    </g>

    <!-- Bottom Terminal Status -->
    <text x="58" y="324" class="mono" font-size="11.5" fill="#64748B">
      ✦ Building Liquid Glass apps, cross-device workspaces &amp; autonomous developer workflows
    </text>

    <!-- Right: Orbital Tech Constellation -->
    <g>
      <!-- Ambient Backdrop Circle -->
      <circle cx="985" cy="185" r="142" fill="#0F172A" fill-opacity="0.45" stroke="#1E293B" stroke-width="1"/>

      <!-- Outer Orbit (Clockwise) -->
      <g>
        <circle cx="985" cy="185" r="134" stroke="url(#ringGrad1)" stroke-width="1.5" stroke-dasharray="10 8" stroke-opacity="0.75"/>
        <circle cx="985" cy="51" r="6" fill="#38BDF8" filter="url(#softGlow)"/>
        <circle cx="1119" cy="185" r="5" fill="#34D399" filter="url(#softGlow)"/>
        <circle cx="851" cy="185" r="5" fill="#A78BFA" filter="url(#softGlow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 985 185" to="360 985 185" dur="28s" repeatCount="indefinite"/>
      </g>

      <!-- Middle Orbit (Counter-Clockwise) -->
      <g>
        <circle cx="985" cy="185" r="96" stroke="url(#ringGrad2)" stroke-width="1.4" stroke-dasharray="6 6" stroke-opacity="0.8"/>
        <circle cx="985" cy="89" r="5" fill="#F97316" filter="url(#softGlow)"/>
        <circle cx="985" cy="281" r="5" fill="#38BDF8" filter="url(#softGlow)"/>
        <animateTransform attributeName="transform" type="rotate" from="360 985 185" to="0 985 185" dur="18s" repeatCount="indefinite"/>
      </g>

      <!-- Inner Orbit (Clockwise) -->
      <g>
        <circle cx="985" cy="185" r="58" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="3 5"/>
        <circle cx="1043" cy="185" r="4" fill="#FBBF24" filter="url(#softGlow)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 985 185" to="360 985 185" dur="11s" repeatCount="indefinite"/>
      </g>

      <!-- Pulse Wave -->
      <circle cx="985" cy="185" r="32" stroke="#38BDF8" stroke-width="1.2" fill="none">
        <animate attributeName="r" values="30;115" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.6s" repeatCount="indefinite"/>
      </circle>

      <!-- Core Node -->
      <g class="pulse-core">
        <circle cx="985" cy="185" r="32" fill="#0F172A" stroke="url(#glassBorder)" stroke-width="2"/>
        <text x="985" y="182" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#E0F2FE">&lt;/&gt;</text>
        <text x="985" y="198" text-anchor="middle" class="mono" font-size="9.5" fill="#7DD3FC">BUILD</text>
      </g>

      <!-- Static Floating Tech Tags Around Orbit -->
      <g>
        <rect x="772" y="64" width="66" height="22" rx="11" fill="#0F172A" fill-opacity="0.9" stroke="#F97316" stroke-opacity="0.6"/>
        <text x="805" y="79" text-anchor="middle" class="mono" font-size="10.5" fill="#FDBA74">Swift</text>

        <rect x="1110" y="64" width="58" height="22" rx="11" fill="#0F172A" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.6"/>
        <text x="1139" y="79" text-anchor="middle" class="mono" font-size="10.5" fill="#7DD3FC">Go</text>

        <rect x="760" y="286" width="84" height="22" rx="11" fill="#0F172A" fill-opacity="0.9" stroke="#3B82F6" stroke-opacity="0.6"/>
        <text x="802" y="301" text-anchor="middle" class="mono" font-size="10.5" fill="#93C5FD">TypeScript</text>

        <rect x="1096" y="286" width="76" height="22" rx="11" fill="#0F172A" fill-opacity="0.9" stroke="#A78BFA" stroke-opacity="0.6"/>
        <text x="1134" y="301" text-anchor="middle" class="mono" font-size="10.5" fill="#DDD6FE">Kotlin</text>
      </g>
    </g>
  </g>
</svg>
